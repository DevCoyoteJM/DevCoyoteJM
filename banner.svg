<svg width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Resplandor neón nativo compatible con todos los navegadores -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg { fill: #0d1117; }
    .border { fill: none; stroke: #10b981; stroke-opacity: 0.25; stroke-width: 1.5; }

    /* Lluvia de fondo continua */
    .ambient {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #10b981;
      opacity: 0.18;
      animation: ambientFall linear infinite;
    }
    .a1 { animation-duration: 4.2s; animation-delay: -1.1s; }
    .a2 { animation-duration: 5.5s; animation-delay: -2.8s; }
    .a3 { animation-duration: 3.8s; animation-delay: -0.4s; }
    .a4 { animation-duration: 4.9s; animation-delay: -3.5s; }

    @keyframes ambientFall {
      0% { transform: translateY(-160px); }
      100% { transform: translateY(240px); }
    }

    /* Ráfagas de lluvia que "descifran" cada letra */
    .decoder {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #34d399;
      opacity: 0;
      animation: dropStream 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    .head { fill: #ffffff; }

    @keyframes dropStream {
      0% { transform: translateY(-140px); opacity: 0; }
      15% { opacity: 0.95; }
      75% { opacity: 0.85; }
      100% { transform: translateY(250px); opacity: 0; }
    }

    /* Letras del nombre que aparecen al impacto de la ráfaga */
    .char {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, monospace;
      font-size: 36px;
      font-weight: 800;
      text-anchor: middle;
      opacity: 0;
      animation: materialize 0.55s ease-out forwards;
    }

    @keyframes materialize {
      0% {
        opacity: 0;
        fill: #ffffff;
        filter: url(#neon-glow);
      }
      45% {
        opacity: 1;
        fill: #34d399;
        filter: url(#neon-glow);
      }
      100% {
        opacity: 1;
        fill: #f0f6fc;
      }
    }

    /* Subtítulo tipo consola al finalizar el nombre */
    .subtitle {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      fill: #34d399;
      text-anchor: middle;
      opacity: 0;
      animation: fadeInSub 0.8s ease-out 2.5s forwards;
    }
    .cursor {
      animation: blink 1s step-end infinite;
    }

    @keyframes fadeInSub {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 0.95; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Fondo GitHub Dark -->
  <rect width="850" height="220" rx="12" class="bg" />
  <rect x="1" y="1" width="848" height="218" rx="11" class="border" />

  <!-- Lluvia Matrix ambiental en segundo plano -->
  <text x="45" y="0" class="ambient a1">1<tspan x="45" dy="15">0</tspan><tspan x="45" dy="15">1</tspan><tspan x="45" dy="15">1</tspan><tspan x="45" dy="15">0</tspan><tspan x="45" dy="15">0</tspan><tspan x="45" dy="15">1</tspan><tspan x="45" dy="15">0</tspan></text>
  <text x="115" y="0" class="ambient a3">0<tspan x="115" dy="15">1</tspan><tspan x="115" dy="15">0</tspan><tspan x="115" dy="15">1</tspan><tspan x="115" dy="15">1</tspan><tspan x="115" dy="15">0</tspan><tspan x="115" dy="15">1</tspan><tspan x="115" dy="15">1</tspan></text>
  <text x="240" y="0" class="ambient a2">1<tspan x="240" dy="15">1</tspan><tspan x="240" dy="15">0</tspan><tspan x="240" dy="15">0</tspan><tspan x="240" dy="15">1</tspan><tspan x="240" dy="15">0</tspan><tspan x="240" dy="15">1</tspan><tspan x="240" dy="15">0</tspan></text>
  <text x="375" y="0" class="ambient a4">0<tspan x="375" dy="15">0</tspan><tspan x="375" dy="15">1</tspan><tspan x="375" dy="15">1</tspan><tspan x="375" dy="15">0</tspan><tspan x="375" dy="15">1</tspan><tspan x="375" dy="15">0</tspan><tspan x="375" dy="15">1</tspan></text>
  <text x="475" y="0" class="ambient a1">1<tspan x="475" dy="15">0</tspan><tspan x="475" dy="15">0</tspan><tspan x="475" dy="15">1</tspan><tspan x="475" dy="15">1</tspan><tspan x="475" dy="15">1</tspan><tspan x="475" dy="15">0</tspan><tspan x="475" dy="15">0</tspan></text>
  <text x="610" y="0" class="ambient a3">0<tspan x="610" dy="15">1</tspan><tspan x="610" dy="15">1</tspan><tspan x="610" dy="15">0</tspan><tspan x="610" dy="15">1</tspan><tspan x="610" dy="15">0</tspan><tspan x="610" dy="15">1</tspan><tspan x="610" dy="15">1</tspan></text>
  <text x="735" y="0" class="ambient a2">1<tspan x="735" dy="15">0</tspan><tspan x="735" dy="15">1</tspan><tspan x="735" dy="15">0</tspan><tspan x="735" dy="15">0</tspan><tspan x="735" dy="15">1</tspan><tspan x="735" dy="15">1</tspan><tspan x="735" dy="15">0</tspan></text>
  <text x="805" y="0" class="ambient a4">0<tspan x="805" dy="15">1</tspan><tspan x="805" dy="15">0</tspan><tspan x="805" dy="15">1</tspan><tspan x="805" dy="15">1</tspan><tspan x="805" dy="15">0</tspan><tspan x="805" dy="15">0</tspan><tspan x="805" dy="15">1</tspan></text>

  <!-- Letras de JONATHAN MENDEZ (aparecen secuencialmente) -->
  <text x="187" y="112" class="char" style="animation-delay: 0.45s;">J</text>
  <text x="221" y="112" class="char" style="animation-delay: 0.60s;">O</text>
  <text x="255" y="112" class="char" style="animation-delay: 0.75s;">N</text>
  <text x="289" y="112" class="char" style="animation-delay: 0.90s;">A</text>
