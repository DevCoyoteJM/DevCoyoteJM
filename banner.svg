<svg width="850" height="220" viewBox="0 0 850 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .border { fill: none; stroke: #10b981; stroke-opacity: 0.3; stroke-width: 1.5; }

    .ambient {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #10b981;
      opacity: 0.22;
      text-anchor: middle;
      animation: ambientFall linear infinite;
    }
    .a1 { animation-duration: 4.2s; animation-delay: -1.1s; }
    .a2 { animation-duration: 5.4s; animation-delay: -2.6s; }
    .a3 { animation-duration: 3.8s; animation-delay: -0.5s; }
    .a4 { animation-duration: 4.8s; animation-delay: -3.2s; }

    @keyframes ambientFall {
      0% { transform: translateY(-130px); }
      100% { transform: translateY(240px); }
    }

    .decoder {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      font-weight: bold;
      fill: #34d399;
      text-anchor: middle;
      opacity: 0;
      animation: dropStream 1.1s ease-in-out forwards;
    }
    .head { fill: #ffffff; }

    @keyframes dropStream {
      0% { transform: translateY(-100px); opacity: 0; }
      15% { opacity: 0.95; }
      80% { opacity: 0.85; }
      100% { transform: translateY(250px); opacity: 0; }
    }

    .char {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 36px;
      font-weight: 800;
      text-anchor: middle;
      fill: #f0f6fc;
      opacity: 0;
      animation: materialize 0.55s ease-out forwards;
    }

    @keyframes materialize {
      0% { opacity: 0; fill: #ffffff; }
      45% { opacity: 1; fill: #34d399; }
      100% { opacity: 1; fill: #f0f6fc; }
    }

    .subtitle {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      fill: #34d399;
      text-anchor: middle;
      opacity: 0;
      animation: fadeInSub 0.7s ease-out 2.35s forwards;
    }

    @keyframes fadeInSub {
      from { opacity: 0; }
      to { opacity: 0.95; }
    }
  </style>

