  <text x="629" y="112" class="char" style="animation-delay: 2.30s;">E</text>
  <text x="663" y="112" class="char" style="animation-delay: 2.45s;">Z</text>

  <!-- Ráfagas sincronizadas que caen exactamente sobre cada letra -->
  <text x="183" y="0" class="decoder" style="animation-delay: 0.10s;">0<tspan x="183" dy="15">1</tspan><tspan x="183" dy="15">0</tspan><tspan x="183" dy="15">1</tspan><tspan x="183" dy="15" class="head">J</tspan></text>
  <text x="217" y="0" class="decoder" style="animation-delay: 0.25s;">1<tspan x="217" dy="15">0</tspan><tspan x="217" dy="15">1</tspan><tspan x="217" dy="15">1</tspan><tspan x="217" dy="15" class="head">O</tspan></text>
  <text x="251" y="0" class="decoder" style="animation-delay: 0.40s;">0<tspan x="251" dy="15">0</tspan><tspan x="251" dy="15">1</tspan><tspan x="251" dy="15">0</tspan><tspan x="251" dy="15" class="head">N</tspan></text>
  <text x="285" y="0" class="decoder" style="animation-delay: 0.55s;">1<tspan x="285" dy="15">1</tspan><tspan x="285" dy="15">0</tspan><tspan x="285" dy="15">1</tspan><tspan x="285" dy="15" class="head">A</tspan></text>
  <text x="319" y="0" class="decoder" style="animation-delay: 0.70s;">0<tspan x="319" dy="15">1</tspan><tspan x="319" dy="15">1</tspan><tspan x="319" dy="15">0</tspan><tspan x="319" dy="15" class="head">T</tspan></text>
  <text x="353" y="0" class="decoder" style="animation-delay: 0.85s;">1<tspan x="353" dy="15">0</tspan><tspan x="353" dy="15">0</tspan><tspan x="353" dy="15">1</tspan><tspan x="353" dy="15" class="head">H</tspan></text>
  <text x="387" y="0" class="decoder" style="animation-delay: 1.00s;">0<tspan x="387" dy="15">1</tspan><tspan x="387" dy="15">0</tspan><tspan x="387" dy="15">1</tspan><tspan x="387" dy="15" class="head">A</tspan></text>
  <text x="421" y="0" class="decoder" style="animation-delay: 1.15s;">1<tspan x="421" dy="15">1</tspan><tspan x="421" dy="15">0</tspan><tspan x="421" dy="15">0</tspan><tspan x="421" dy="15" class="head">N</tspan></text>

  <text x="489" y="0" class="decoder" style="animation-delay: 1.35s;">0<tspan x="489" dy="15">1</tspan><tspan x="489" dy="15">1</tspan><tspan x="489" dy="15">0</tspan><tspan x="489" dy="15" class="head">M</tspan></text>
  <text x="523" y="0" class="decoder" style="animation-delay: 1.50s;">1<tspan x="523" dy="15">0</tspan><tspan x="523" dy="15">1</tspan><tspan x="523" dy="15">1</tspan><tspan x="523" dy="15" class="head">E</tspan></text>
  <text x="557" y="0" class="decoder" style="animation-delay: 1.65s;">0<tspan x="557" dy="15">0</tspan><tspan x="557" dy="15">1</tspan><tspan x="557" dy="15">0</tspan><tspan x="557" dy="15" class="head">N</tspan></text>
  <text x="591" y="0" class="decoder" style="animation-delay: 1.80s;">1<tspan x="591" dy="15">1</tspan><tspan x="591" dy="15">0</tspan><tspan x="591" dy="15">1</tspan><tspan x="591" dy="15" class="head">D</tspan></text>
  <text x="625" y="0" class="decoder" style="animation-delay: 1.95s;">0<tspan x="625" dy="15">1</tspan><tspan x="625" dy="15">0</tspan><tspan x="625" dy="15">1</tspan><tspan x="625" dy="15" class="head">E</tspan></text>
  <text x="659" y="0" class="decoder" style="animation-delay: 2.10s;">1<tspan x="659" dy="15">0</tspan><tspan x="659" dy="15">1</tspan><tspan x="659" dy="15">0</tspan><tspan x="659" dy="15" class="head">Z</tspan></text>

  <!-- Subtítulo -->
  <text x="425" y="158" class="subtitle">> Ingeniero de Sistemas y Computación · Fullstack & AI<tspan class="cursor">_</tspan></text>
</svg>
