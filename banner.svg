  <text x="493" y="112" class="char" style="animation-delay: 1.70s;">M</text>
  <text x="527" y="112" class="char" style="animation-delay: 1.85s;">E</text>
  <text x="561" y="112" class="char" style="animation-delay: 2.00s;">N</text>
